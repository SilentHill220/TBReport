            // Gather infobox fields
            const infobox = {};
            document.querySelectorAll('[data-infobox]').forEach(el => {
                const key = el.dataset.infobox;
                let value = el.value.trim();
                // Check if it's an array field (contains comma)
                if (value.includes(',')) {
                    value = value.split(',').map(v => v.trim()).filter(v => v);
                }
                if (value && (Array.isArray(value) ? value.length > 0 : true)) {
                    infobox[key] = value;
                }
            });

            // Parse sections from content
            const sections = {};
            const sectionRegex = /^## (.+)$/gm;
            let lastIndex = 0;
            let lastSection = '概述';
            let match;

            const contentLines = content.split('\n');
            let currentSection = '概述';
            let currentContent = [];

            for (const line of contentLines) {
                if (line.startsWith('## ')) {
                    if (currentContent.length > 0) {
                        sections[currentSection] = currentContent.join('\n').trim();
                    }
                    currentSection = line.substring(3).trim();
                    currentContent = [];
                } else {
                    currentContent.push(line);
                }
            }
            if (currentContent.length > 0) {
                sections[currentSection] = currentContent.join('\n').trim();
            }

            const entryData = {
                type,
                title,
                subtitle,
                icon: iconImageUrl || '',  // 使用图片URL作为图标
                tags,
                infobox,
                sections,
                cover_image: coverImageUrl,
                talent_meta: type === 'talent' ? {
                    group_id: document.getElementById('editTalentGroup').value.trim(),
                    parents: document.getElementById('editTalentParents').value.split(',').map(s => s.trim()).filter(s => s),
                    raw_pre: '' // Optional
                } : undefined,
                images: contentImages,
                related: relatedEntries
            };

            try {
                const resp = await fetch('/api/wiki/' + id, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(entryData)
                });
                const data = await resp.json();
                if (data.success) {
                    showToast('保存成功！');
                    await loadIndex();
                    currentEntry = { id, ...entryData };
                    await loadEntry(id);
                } else {
                    showToast('保存失败: ' + (data.message || ''), true);
                }
            } catch (e) {
                showToast('保存失败', true);
            }
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const dropdown = document.getElementById('searchDropdown');

            if (!query) {
                dropdown.classList.remove('active');
                return;
            }

            const matches = Object.entries(allEntries).filter(([id, entry]) =>
                (entry.title || '').toLowerCase().includes(query) ||
                id.toLowerCase().includes(query) ||
                (entry.subtitle || '').toLowerCase().includes(query) ||
                (entry.tags || []).some(tag => tag.toLowerCase().includes(query))
            ).slice(0, 8);

            if (matches.length === 0) {
                dropdown.innerHTML = '<div class="search-no-result">未找到匹配的词条</div>';
            } else {
                dropdown.innerHTML = matches.map(([id, entry]) => {
                    // 判断图标类型：图片URL、emoji或占位符
                    let iconHtml;
                    if (entry.icon && entry.icon.startsWith('/wiki/assets/')) {
                        iconHtml = `<img src="${entry.icon}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:4px;">`;
                    } else {
                        const placeholder = typeIconPlaceholders[entry.type] || '?';
                        iconHtml = `<span style="font-size:1.2rem;">${placeholder}</span>`;
                    }
                    return `
                            <div class="search-result-item" onclick="loadEntry('${id}'); closeSearchDropdown();" >
                        <div class="search-result-icon" style="background: ${typeColors[entry.type] || '#333'}22; color: ${typeColors[entry.type] || '#888'}">
                            ${iconHtml}
                        </div>
                        <div class="search-result-info">
                            <div class="search-result-title">${entry.title || id}</div>
                            <div class="search-result-type">${typeNames[entry.type] || '未分类'}</div>
                        </div>
                    </div>
                            `;
                }).join('');
            }

            dropdown.classList.add('active');
        }

        function closeSearchDropdown() {
            document.getElementById('searchDropdown').classList.remove('active');
            document.getElementById('searchInput').value = '';
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-box')) {
                document.getElementById('searchDropdown').classList.remove('active');
            }
            if (!e.target.closest('.entry-picker')) {
                document.getElementById('entryPickerDropdown').classList.remove('active');
            }
        });

        // ===== IMAGE UPLOAD FUNCTIONS =====

        async function uploadImage(file) {
            const formData = new FormData();
            formData.append('file', file);

            try {
                const resp = await fetch('/api/wiki/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await resp.json();
                if (data.success) {
                    return data.url;
                } else {
                    showToast('上传失败: ' + data.message, true);
                    return null;
                }
            } catch (e) {
                showToast('上传失败', true);
                return null;
            }
        }

        async function handleCoverImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            showToast('正在上传...');
            const url = await uploadImage(file);
            if (url) {
                coverImageUrl = url;
                renderCoverImagePreview();
                showToast('封面图上传成功');
            }
        }

        function renderCoverImagePreview() {
            const zone = document.getElementById('coverImageZone');
            if (coverImageUrl) {
                zone.innerHTML = `
                            <img src = "${coverImageUrl}" class="image-preview" >
                                <br>
                                    <button class="image-remove-btn" onclick="event.stopPropagation(); removeCoverImage()">移除</button>
                                    `;
                zone.classList.add('has-image');
            } else {
                zone.innerHTML = `
                    <div class="image-upload-icon">📷</div>
                    <div class="image-upload-text">点击上传封面图片</div>
                `;
                zone.classList.remove('has-image');
            }
        }

        function removeCoverImage() {
            coverImageUrl = '';
            renderCoverImagePreview();
        }

        // ===== ICON IMAGE UPLOAD =====
        async function handleIconImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            showToast('正在上传...');
            const url = await uploadImage(file);
            if (url) {
                iconImageUrl = url;
                renderIconPreview();
                showToast('图标上传成功');
            }
            event.target.value = '';
        }

        function renderIconPreview() {
            const zone = document.getElementById('iconUploadZone');
            if (iconImageUrl) {
                zone.innerHTML = `<img src="${iconImageUrl}" alt="词条图标">`;
                zone.classList.add('has-icon');
            } else {
                zone.innerHTML = `
                    <div class="icon-upload-placeholder" id="iconUploadPlaceholder">
                        <span style="font-size: 1.5rem; color: var(--text-muted);">+</span>
                        <span style="font-size: 11px; color: var(--text-muted);">上传图标</span>
                    </div>
                `;
                zone.classList.remove('has-icon');
            }
        }

        function removeIconImage() {
            iconImageUrl = '';
            renderIconPreview();
        }

        async function handleContentImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            showToast('正在上传...');
            const url = await uploadImage(file);
            if (url) {
                contentImages.push(url);
                renderContentImagesGallery();
                showToast('图片上传成功');
            }
            event.target.value = '';
        }

        function renderContentImagesGallery() {
            const gallery = document.getElementById('contentImagesGallery');
            let html = contentImages.map((url, idx) => `
                                    <div class="gallery-item">
                                        <img src="${url}" alt="设定图 ${idx + 1}">
                                            <button class="gallery-item-remove" onclick="removeContentImage(${idx})">×</button>
                                    </div>
                                    `).join('');

            html += `
                                    <div class="add-image-btn" onclick="document.getElementById('contentImageInput').click()">
                                        <span style="font-size: 1.5rem;">+</span>
                                        <span style="font-size: 12px;">添加图片</span>
                                    </div>
                                    `;
            gallery.innerHTML = html;
        }

        function removeContentImage(index) {
            contentImages.splice(index, 1);
            renderContentImagesGallery();
        }

        // ===== RELATED ENTRIES SELECTOR =====
        function filterEntriesForPicker() {
            const query = document.getElementById('entryPickerInput').value.toLowerCase().trim();
            const dropdown = document.getElementById('entryPickerDropdown');
            const currentId = document.getElementById('editId').value;

            if (!query) {
                dropdown.classList.remove('active');
                return;
            }

            const matches = Object.entries(allEntries).filter(([id, entry]) =>
                id !== currentId &&
                !relatedEntries.includes(id) &&
                ((entry.title || '').toLowerCase().includes(query) || id.toLowerCase().includes(query))
            ).slice(0, 6);

            if (matches.length === 0) {
                dropdown.innerHTML = '<div style="padding: 12px; color: var(--text-muted); text-align: center;">未找到匹配词条</div>';
            } else {
                dropdown.innerHTML = matches.map(([id, entry]) => `
                    <div class="entry-picker-item" onclick="addRelatedEntry('${id}')">
                        <span class="entry-picker-item-icon">${entry.icon || typeIcons[entry.type] || '📄'}</span>
                        <div class="entry-picker-item-info">
                            <div class="entry-picker-item-title">${entry.title || id}</div>
                            <div class="entry-picker-item-type">${typeNames[entry.type] || '未分类'}</div>
                        </div>
                    </div>
                `).join('');
            }
            dropdown.classList.add('active');
        }

        function addRelatedEntry(entryId) {
            if (!relatedEntries.includes(entryId)) {
                relatedEntries.push(entryId);
                renderRelatedEntries();
            }
            document.getElementById('entryPickerInput').value = '';
            document.getElementById('entryPickerDropdown').classList.remove('active');
        }

        function removeRelatedEntry(entryId) {
            relatedEntries = relatedEntries.filter(id => id !== entryId);
            renderRelatedEntries();
        }

        function renderRelatedEntries() {
            const list = document.getElementById('relatedEntriesList');
            if (relatedEntries.length === 0) {
                list.innerHTML = '<span style="color: var(--text-muted); font-size: 13px;">暂无相关词条</span>';
            } else {
                list.innerHTML = relatedEntries.map(id => {
                    const entry = allEntries[id] || {};
                    return `
                        <div class="related-entry-tag">
                            <span>${entry.icon || '📄'}</span>
                            <span>${entry.title || id}</span>
                            <button class="related-entry-remove" onclick="removeRelatedEntry('${id}')">×</button>
                        </div>
                    `;
                }).join('');
            }
        }

        // ===== RESET EDIT FORM =====
        function resetEditFormState() {
            coverImageUrl = '';
            contentImages = [];
            relatedEntries = [];
            iconImageUrl = '';
            renderCoverImagePreview();
            renderContentImagesGallery();
            renderRelatedEntries();
            renderIconPreview();
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // ===== EDITOR LINK PICKER =====
        function toggleLinkPicker(btn) {
            const dropdown = document.getElementById('linkPickerDropdown');
            const isActive = dropdown.classList.contains('active');

            // Close others
            document.querySelectorAll('.editor-dropdown').forEach(d => d.classList.remove('active'));

            if (!isActive) {
                dropdown.classList.add('active');
                // Position relative to button
                const rect = btn.getBoundingClientRect();
                const containerRect = btn.closest('.form-group').getBoundingClientRect();

                dropdown.style.top = '30px';
                dropdown.style.right = '0';

                document.getElementById('linkPickerInput').focus();
                filterLinkPicker();
            } else {
                dropdown.classList.remove('active');
            }
        }

        function filterLinkPicker() {
            const query = document.getElementById('linkPickerInput').value.toLowerCase().trim();
            const list = document.getElementById('linkPickerList');
            const currentId = document.getElementById('editId').value;

            // Show recent or filtered
            let matches = Object.entries(allEntries);

            if (query) {
                matches = matches.filter(([id, entry]) =>
                    ((entry.title || '').toLowerCase().includes(query) || id.toLowerCase().includes(query))
                );
            }

            matches = matches.slice(0, 8);

            if (matches.length === 0) {
                list.innerHTML = '<div style="padding: 8px; color: var(--text-muted); text-align: center;">无匹配</div>';
            } else {
                list.innerHTML = matches.map(([id, entry]) => `
                    <div class="editor-dropdown-item" onclick="insertLink('${id}', '${entry.title || id}')">
                        <span>${entry.icon || typeIcons[entry.type] || '📄'}</span>
                        <span>${entry.title || id}</span>
                        <span style="margin-left: auto; font-size: 10px; color: var(--text-muted);">${typeNames[entry.type] || '未知'}</span>
                    </div>
                `).join('');
            }
        }

        function insertLink(id, title) {
            const textarea = document.getElementById('editContent');
            const textToInsert = `[${title}](/wiki/${id})`;

            // Insert at cursor
            const startPos = textarea.selectionStart;
            const endPos = textarea.selectionEnd;
            const text = textarea.value;

            textarea.value = text.substring(0, startPos) + textToInsert + text.substring(endPos);

            // Reset cursor
            textarea.selectionStart = textarea.selectionEnd = startPos + textToInsert.length;
            textarea.focus();

            // Close picker
            document.getElementById('linkPickerDropdown').classList.remove('active');
            document.getElementById('linkPickerInput').value = '';
        }

        // Close editor dropdowns on click outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.editor-toolbar-btn') && !e.target.closest('.editor-dropdown')) {
                document.getElementById('linkPickerDropdown').classList.remove('active');
            }
        });

        // ===== DELETE ENTRY =====
        function confirmDeleteEntry() {
            if (!currentEntry || !currentEntry.id) {
                showToast('没有要删除的词条', true);
                return;
            }

            const title = currentEntry.title || currentEntry.id;
            if (confirm(`确定要删除词条 "${title}" 吗？此操作不可撤销。`)) {
                deleteEntry(currentEntry.id);
            }
        }

        async function deleteEntry(entryId) {
            try {
                const resp = await fetch('/api/wiki/' + entryId, {
                    method: 'DELETE'
                });
                const data = await resp.json();
                if (data.success) {
                    showToast('词条已删除');
                    currentEntry = null;
                    await loadIndex();
                    renderPortal();
                    showPortal();
                } else {
                    showToast('删除失败: ' + (data.message || ''), true);
                }
            } catch (e) {
                showToast('删除失败', true);
            }
        }

        function createNewEntryInCategory() {
            if (!isAuthenticated) {
                // Store the intended type for after verification
                pendingNewEntryType = currentCategoryType;
                document.getElementById('verifyModal').classList.add('active');
                document.getElementById('verifyCode').focus();
                return;
            }

            // Already authenticated - directly create
            currentEntry = null;
            enterEditMode();
            if (currentCategoryType) {
                document.getElementById('editType').value = currentCategoryType;
                updateInfoboxFields();
            }
        }

        // ===== KEYBOARD SHORTCUTS =====
        document.addEventListener('keydown', (e) => {
            // Escape - close modal or cancel edit
            if (e.key === 'Escape') {
                const modal = document.getElementById('verifyModal');
                if (modal.classList.contains('active')) {
                    closeModal();
                    return;
                }

                const editView = document.getElementById('editView');
                if (editView.classList.contains('active')) {
                    cancelEdit();
                    return;
                }
            }

            // Ctrl+S - save entry (in edit mode)
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                const editView = document.getElementById('editView');
                if (editView.classList.contains('active')) {
                    e.preventDefault();
                    saveEntry();
                }
            }
        });
    </script>
</body>
